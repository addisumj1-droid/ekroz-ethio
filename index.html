<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ekroz Ethiopia Tender</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50">
<header class="bg-emerald-700 text-white p-6"><h1 class="text-2xl font-bold">Ekroz Ethiopia Tender</h1><p class="text-sm">Free Ethiopian tender listings</p><input id="s" oninput="show()" placeholder="Search..." class="mt-3 p-2 rounded w-full sm:w-80 text-slate-900"></header>
<main class="p-4 max-w-4xl mx-auto"><div id="list" class="grid gap-3"></div></main>
<script>let t=[];fetch('data/tenders.json').then(r=>r.json()).then(d=>{t=d;show()});
function show(){const q=document.getElementById('s').value.toLowerCase();document.getElementById('list').innerHTML=t.filter(x=>(x.title+x.buyer+x.category+x.source).toLowerCase().includes(q)).map(x=>`<div class="bg-white p-4 rounded border"><span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded">${x.category}</span> <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">${x.source}</span><h2 class="font-semibold mt-2">${x.title}</h2><p class="text-sm text-slate-600">${x.buyer} • Deadline: ${x.deadline}</p><a class="text-emerald-700 font-semibold" href="${x.source_url}" target="_blank">View official notice →</a></div>`).join('');}</script></body></html>
